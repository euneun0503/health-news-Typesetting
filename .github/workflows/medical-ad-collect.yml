name: Collect medical-ad news

on:
  schedule:
    - cron: "17 21 * * *"   # 매일 오전 6시 17분(KST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect news (Google News RSS + optional Naver API)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python medical-ad/collector/collect_news.py
      - name: Collect court cases (optional, needs LAW_OC)
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: python medical-ad/collector/collect_prec.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add medical-ad/data/
          git diff --cached --quiet || git commit -m "chore: update collected news/cases"
          git push
